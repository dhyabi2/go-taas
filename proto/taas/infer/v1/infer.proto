syntax = "proto3";

package taas.infer.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/infer/v1;inferv1";

// InferServiceService manages the lifecycle of inference services:
// desired-state maintenance, change publication to the message queue and
// endpoint registration for the data-plane gateway.
service InferServiceService {
  // CreateInferenceService deploys a model with the given image and
  // replicas. The change is published to the message queue and applied
  // by the controller.
  // Admin-surface API: served under /api/v1/admin.
  rpc CreateInferenceService(CreateInferenceServiceRequest) returns (CreateInferenceServiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/inference-services"
      body: "*"
    };
  }

  // ListInferenceServices returns inference services of the caller's
  // organization.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListInferenceServices(ListInferenceServicesRequest) returns (ListInferenceServicesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/inference-services"};
  }

  // GetInferenceService returns one inference service with its endpoints.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetInferenceService(GetInferenceServiceRequest) returns (GetInferenceServiceResponse) {
    option (google.api.http) = {get: "/api/v1/admin/inference-services/{service_id}"};
  }

  // ScaleInferenceService changes the replica count.
  // Admin-surface API: served under /api/v1/admin.
  rpc ScaleInferenceService(ScaleInferenceServiceRequest) returns (ScaleInferenceServiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/inference-services/{service_id}:scale"
      body: "*"
    };
  }

  // DeleteInferenceService tears an inference service down.
  // Admin-surface API: served under /api/v1/admin.
  rpc DeleteInferenceService(DeleteInferenceServiceRequest) returns (DeleteInferenceServiceResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/inference-services/{service_id}"};
  }

  // PlaygroundInfer sends a test inference through the service using a
  // selected org API key (feature #12, Increment B). The call is metered
  // and logged through the normal data-plane path.
  // Admin-surface API: served under /api/v1/admin.
  rpc PlaygroundInfer(PlaygroundInferRequest) returns (PlaygroundInferResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/inference-services/{service_id}:playground"
      body: "*"
    };
  }

  // PlaygroundModel sends a test inference for a model on the user
  // surface (feature-17 AD8): it resolves a ready inference service for
  // the model and forwards over the normal metered path. The tenant
  // contract mirrors the OpenAI-compatible endpoint and never names an
  // inference service.
  // User-surface API: served under /api/v1.
  rpc PlaygroundModel(PlaygroundModelRequest) returns (PlaygroundModelResponse) {
    option (google.api.http) = {
      post: "/api/v1/models/{model_id}:playground"
      body: "*"
    };
  }
}

message CreateInferenceServiceRequest {
  string name = 1;
  string model_id = 2;
  string model_version = 3;
  string image_id = 4;
  int32 replicas = 5;
  // accelerator names the hardware platform (nvidia, iluvatar, metax).
  string accelerator = 6;
  // accelerator_type is the concrete card model requested.
  string accelerator_type = 7;
}

message CreateInferenceServiceResponse {
  taas.common.v1.Response response = 1;
  string service_id = 2;
}

message ListInferenceServicesRequest {
  taas.common.v1.PageRequest page = 1;
}

message ListInferenceServicesResponse {
  taas.common.v1.Response response = 1;
  repeated InferenceServiceSummary services = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message InferenceServiceSummary {
  string service_id = 1;
  string name = 2;
  string model_id = 3;
  string model_version = 4;
  string image_id = 5;
  int32 replicas = 6;
  // state is the observed lifecycle state: pending, deploying, running,
  // failed, terminated.
  string state = 7;
  int64 updated_at = 8;
}

message GetInferenceServiceRequest {
  string service_id = 1;
}

message GetInferenceServiceResponse {
  taas.common.v1.Response response = 1;
  InferenceServiceSummary service = 2;
  repeated string endpoints = 3;
}

message ScaleInferenceServiceRequest {
  string service_id = 1;
  int32 replicas = 2;
}

message ScaleInferenceServiceResponse {
  taas.common.v1.Response response = 1;
}

message DeleteInferenceServiceRequest {
  string service_id = 1;
}

message DeleteInferenceServiceResponse {
  taas.common.v1.Response response = 1;
}

message PlaygroundInferRequest {
  string service_id = 1;
  // api_key_id is the selected org API key identity (feature #12, AD8).
  string api_key_id = 2;
  string model_id = 3;
  string prompt = 4;
}

message PlaygroundInferResponse {
  taas.common.v1.Response response = 1;
  string completion = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 cached_tokens = 5;
  int64 reasoning_tokens = 6;
  int64 latency_ms = 7;
}

// Model-based tenant playground (feature-17 AD8).
message PlaygroundModelRequest {
  string model_id = 1; // path
  // api_key_id is the selected org API key identity.
  string api_key_id = 2;
  string prompt = 3;
  double temperature = 4;
  int32 max_tokens = 5;
}
message PlaygroundModelResponse {
  taas.common.v1.Response response = 1;
  string request_id = 2;
  string completion = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  int64 latency_ms = 6;
}
