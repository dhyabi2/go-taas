# Configuration for the controller binary. It only needs the message
# queue and log settings; database and redis sections are ignored.

log:
  level: info
  encoding: console

mq:
  driver: nats
  url: nats://127.0.0.1:4222
  namespace: taas-dev

infer:
  # endpointBaseURL composes the endpoint URL reported for running
  # services. Empty means the controller falls back to the in-cluster
  # Service DNS name.
  endpointBaseURL: ""
  # autoscaling (feature #16): the controller reports autoscaling status
  # at most once per statusReportInterval per service.
  autoscaling:
    statusReportInterval: 5s

controller:
  workers: 4
  maxRetries: 5
  # kubeconfig is an explicit kubeconfig path the controller uses to reach
  # the Kubernetes cluster. Empty means the in-cluster config is used,
  # falling back to ~/.kube/config for local development. In the compose
  # stack this is set to the mounted host kubeconfig (CONFIG_CONTROLLER_KUBECONFIG).
  kubeconfig: ""
