# Local deployment-verification stack for go-taas.
#
# Brings up the full control plane (taas-server) with its backing
# services (PostgreSQL, Redis, NATS, Keycloak) so features can be
# verified against a real deployment before they are handed downstream:
#
#   make compose-up     # build images and start the stack
#   make compose-down   # stop and remove the stack
#
# The gateway listens on http://127.0.0.1:9091, gRPC on 9090 and the
# monitor port (metrics/healthz) on 9092. Keycloak (the local OIDC IdP
# for SSO debugging) is at http://localhost:8080 (admin / admin).

name: go-taas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taas
      POSTGRES_PASSWORD: taas
      POSTGRES_DB: taas
    # No host port binding: the stack is reached through taas-server's
    # ports, and binding 5432 would conflict with a host PostgreSQL.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taas -d taas"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ["-js"]
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 4222 | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO object store backing the JuiceFS model-weights filesystem. The
  # "taas" bucket is created by the minio-init job on startup.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taas-minio-secret}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - minio-data:/data

  # One-shot job that creates the "taas" bucket (idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-taas} ${MINIO_ROOT_PASSWORD:-taas-minio-secret}
        mc mb --ignore-existing local/${MINIO_BUCKET:-taas}
        echo "minio bucket ${MINIO_BUCKET:-taas} ready"

  # JuiceFS client that mounts the model-weights filesystem (backed by
  # MinIO + Redis) and shares it with the control plane through the
  # juicefs-data named volume. The control plane writes downloaded model
  # weights here; inference pods read the same files through the
  # JuiceFS-backed StorageClass in the cluster.
  juicefs:
    image: juicedata/juicefs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        juicefs format --storage=${JUICE_FS_STORAGE:-s3} --bucket=${JUICE_FS_BUCKET} --access-key=${MINIO_ROOT_USER:-taas} --secret-key=${MINIO_ROOT_PASSWORD:-taas-minio-secret} ${JUICE_FS_META_URL} ${JUICE_FS_NAME} || true
        juicefs mount -d ${JUICE_FS_META_URL} /mnt/jfs
        sleep infinity
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - juicefs-data:/mnt/jfs

  # Local OIDC identity provider for debugging the SSO flow (feature #7).
  # The realm, a confidential client and a test user are imported from
  # deploy/compose/keycloak/realm-export.json on first start.
  #
  # Reachability: the SSO provider's issuer must be reachable from BOTH
  # the host browser (authorize redirect) and the taas-server container
  # (token exchange). We use the single hostname `keycloak` for both:
  #   - inside the compose network it resolves to this container;
  #   - on the host it must resolve to 127.0.0.1 (add to /etc/hosts):
  #       127.0.0.1 keycloak
  # The admin console is at http://localhost:8080 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -qi '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  taas-server:
    image: ghcr.io/go-taas/go-taas/taas-server:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      juicefs:
        condition: service_started
    environment:
      # Configuration overrides via the CONFIG_ env prefix (see
      # configs/config.yaml); service discovery inside the compose
      # network uses the service names.
      CONFIG_DB_MASTER_HOST: postgres
      CONFIG_REDIS_HOST: redis
      CONFIG_MQ_URL: nats://nats:4222
      # Feature #21 (SDK/Quickstart): the inference gateway's public base
      # URL. The quickstart page reads it via GET /api/v1/inference-endpoint
      # and derives the OpenAI-compatible base URL (<base>/v1).
      CONFIG_INFER_ENDPOINTBASEURL: https://infer.example.com
      # Feature: model download. The weights directory is the JuiceFS
      # mount shared with the inference pods.
      CONFIG_MODEL_WEIGHTSDIR: /data/weights
      # Feature: image import. The internal Harbor registry is read from
      # the .env file.
      CONFIG_IMAGE_HARBOR_URL: ${HARBOR_URL:-}
      CONFIG_IMAGE_HARBOR_USERNAME: ${HARBOR_USERNAME:-}
      CONFIG_IMAGE_HARBOR_PASSWORD: ${HARBOR_PASSWORD:-}
      CONFIG_IMAGE_HARBOR_PROJECT: taas
    volumes:
      - juicefs-data:/data/weights
    ports:
      - "9090:9090" # gRPC
      - "9091:9091" # gateway (HTTP/JSON)
      - "9092:9092" # monitor (metrics, healthz)

  # The controller reconciles desired-state messages from NATS against a
  # real Kubernetes cluster. It reads the host's kubeconfig (~/.kube/config)
  # so the compose stack can manage the cluster the operator is logged into.
  # The kubeconfig is mounted read-only at /etc/taas/kubeconfig and selected
  # via CONFIG_CONTROLLER_KUBECONFIG. To manage a different cluster, point
  # KUBECONFIG at that cluster's kubeconfig before `make compose-up`.
  controller:
    image: ghcr.io/go-taas/go-taas/controller:dev
    depends_on:
      nats:
        condition: service_healthy
    environment:
      CONFIG_MQ_URL: nats://nats:4222
      CONFIG_CONTROLLER_KUBECONFIG: /etc/taas/kubeconfig
      CONFIG_INFER_ENDPOINTBASEURL: https://infer.example.com
      # Feature: the JuiceFS-backed StorageClass the controller
      # provisions the model-weights PVC from (read from .env).
      CONFIG_CONTROLLER_WEIGHTS_STORAGECLASS: ${WEIGHTS_STORAGE_CLASS:-}
    volumes:
      - ${KUBECONFIG:-$HOME/.kube/config}:/etc/taas/kubeconfig:ro

volumes:
  pgdata:
  minio-data:
  juicefs-data:
